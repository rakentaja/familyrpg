[project]
name = "gm-ai-train"
version = "0.1.0"
description = "Training and export for the Guide assistant models (tagger + fallback)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.5",
  "transformers>=4.50",
  "tokenizers>=0.21",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "numpy>=1.26",
  "huggingface_hub>=0.26",
]

[project.optional-dependencies]
# only needed for the generative fallback's ONNX export
fallback = ["optimum[onnxruntime]>=1.24", "accelerate>=1.0"]

[tool.uv]
package = false
