<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sleighbound</title>
<meta name="description" content="A cosy co-op Christmas adventure for the whole family. Find the presents and bring back the Star before Midnight!">
<meta name="theme-color" content="#B4ABC6">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sleighbound">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IM+Fell+English&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#e9e1d3;color:#2a2328;overflow:hidden;overscroll-behavior:none}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#f2eadb;font-family:Kalam,'Comic Sans MS','Chalkboard SE',cursive;z-index:100;transition:opacity .4s}
  #boot h1{font-family:Cinzel,'Trajan Pro',Georgia,serif;font-size:34px;letter-spacing:.06em;margin:0;color:#8a4a4e}
  #boot .bar{width:min(70vw,280px);height:14px;border:2px solid #2a2328;border-radius:8px 5px 9px 6px;overflow:hidden;background:#f7f3ec}
  #boot .bar i{display:block;height:100%;width:8%;background:#a9bfa0;transition:width .3s}
  #boot p{margin:0;font-size:18px}
  #boot.gone{opacity:0;pointer-events:none}
  noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:20px Georgia,serif;background:#f2eadb}
</style>
</head>
<body>
<canvas id="board" aria-label="Game board"></canvas>
<div id="ui"></div>
<div id="boot" role="status"><h1>Sleighbound</h1><div class="bar"><i id="bootBar"></i></div><p id="bootMsg">Waking the reindeer…</p></div>
<noscript>Sleighbound needs JavaScript to play.</noscript>
<script type="module" src="./%APP%"></script>
</body>
</html>
