<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleighbound — /*TITLE*/ clip review</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IM+Fell+English&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2a2328;--paper:#f2eadb;--paper2:#f7f3ec;--rose:#d8a7a7;--roseInk:#8a4a4e;--sage:#a9bfa0;--lav:#b4abc6;--mute:#5a4e58}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#e9e1d3;font-family:'IM Fell English',Georgia,serif;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
  .app{display:flex;flex-direction:column;height:100%;height:100dvh}
  main{position:relative;flex:1;min-height:0}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #paper{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .38  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    box-shadow:inset 0 0 140px rgba(90,70,50,.3)}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #labels div{position:absolute;transform:translate(-50%,0);font-family:Kalam,cursive;font-size:13px;background:rgba(247,243,236,.9);
    border:1.5px solid var(--ink);border-radius:5px 3px 6px 4px;padding:0 7px;white-space:nowrap;pointer-events:auto;cursor:pointer}
  #labels div.sel{background:var(--sage)}
  header{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
  #meta{font-size:13px;line-height:1.4;background:rgba(247,243,236,.9);border:1.5px solid var(--ink);border-radius:5px;padding:6px 10px;max-width:62%;pointer-events:auto}
  #meta b{font-family:Cinzel,serif;color:var(--roseInk);letter-spacing:.03em}
  #meta .notes{font-family:Kalam,cursive;font-size:12.5px;color:var(--mute)}
  .modes{display:flex;gap:0;pointer-events:auto}
  .modes button{border-radius:0}.modes button:first-child{border-radius:6px 0 0 5px}.modes button:last-child{border-radius:0 6px 5px 0;margin-left:-1.8px}
  .dock{background:var(--paper2);border-top:2px solid var(--ink);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;
    box-shadow:0 -3px 0 rgba(42,35,40,.12)}
  .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  #clips{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:thin}
  button{font-family:Kalam,cursive;font-size:14.5px;background:var(--paper);border:1.8px solid var(--ink);border-radius:6px 3px 7px 4px;padding:4px 11px;cursor:pointer;color:var(--ink);white-space:nowrap;min-height:34px}
  button.on{background:var(--sage)} button:disabled{opacity:.35;cursor:default}
  .clip{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;padding:4px 10px}
  .clip small{font-size:11px;color:var(--mute)}
  .clip.travels small::after{content:' · moves';color:var(--roseInk)}
  .sep{width:1px;height:22px;background:rgba(42,35,40,.25)}
  input[type=range]{accent-color:#7f9a78;height:28px}
  #scrub{flex:1;min-width:140px}
  .lbl{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  #tread{min-width:150px}
  .grow{flex:1}
  .speed{display:flex;align-items:center;gap:6px;white-space:nowrap}
  @media (min-width:900px){
    .app{flex-direction:row-reverse}
    .dock{width:330px;border-top:0;border-left:2px solid var(--ink);box-shadow:-3px 0 0 rgba(42,35,40,.12);padding:14px;gap:10px;overflow:auto}
    #clips{flex-direction:column;flex-wrap:nowrap;overflow-x:visible;overflow-y:auto;max-height:46vh}
    #clips .clip{width:100%}
    h1{display:block!important}
  }
  h1{display:none;font-family:Cinzel,serif;font-size:15px;color:var(--roseInk);margin:0;letter-spacing:.04em}
  .keys{font-size:11.5px;color:var(--mute)}
  @media (max-width:899px){.keys{display:none}}
</style>
</head>
<body>
<div class="app">
  <main>
    <canvas id="c"></canvas><div id="paper"></div><div id="labels"></div>
    <header><div id="meta"></div>
      <div class="modes"><button id="mSingle" class="on">Single</button><button id="mGrid">Grid</button></div></header>
  </main>
  <div class="dock">
    <h1>CLIP REVIEW · /*TITLE*/</h1>
    <div id="clips"></div>
    <div class="row"><button id="bPlay">Pause</button><input type="range" id="scrub" min="0" max="1" step="0.0005" value="0"></div>
    <div class="row"><span class="lbl" id="tread">—</span><span class="grow"></span>
      <span class="speed"><span class="lbl">Speed</span><input type="range" id="speed" min="0.1" max="2" step="0.05" value="1" style="width:90px"><span class="lbl" id="speedv">1.00×</span></span></div>
    <div class="row"><button id="bLoop" class="on">Loop</button><button id="bRoot" disabled title="Root motion: keep the clip on the spot or let the Hips travel">In place</button>
      <span class="lbl">Fade</span><input type="range" id="fade" min="0" max="1" step="0.05" value="0.3" style="width:70px"><span class="lbl" id="fadev">0.30s</span></div>
    <div class="row"><button id="bSkel">Skeleton</button><button id="bInk" class="on">Ink</button><button id="bHatch" class="on">Hatching</button><button id="bCam">Reset view</button></div>
    <div class="keys">1–9 clip · Space play/pause · ← → step frame · G grid · S skeleton · drag to orbit</div>
  </div>
</div>
<script>window.SB_REVIEW = /*DATA*/;</script>
<script type="module">/*APP*/</script>
</body>
</html>
