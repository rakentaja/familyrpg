name: Deploy game to GitHub Pages

# Builds main at / and (if it exists) the v2 branch at /v2/ as a preview. To refresh the preview after pushing v2, run this workflow manually (workflow_dispatch on main).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile && bun test src && bun build.ts
        working-directory: game
      - name: Build v2 preview
        run: |
          if git ls-remote --exit-code --heads origin v2 >/dev/null; then
            git fetch --depth 1 origin v2
            git worktree add ../v2 FETCH_HEAD
            cd ../v2/game && bun install --frozen-lockfile && bun test src && bun build.ts
            mkdir -p "$GITHUB_WORKSPACE/game/dist/v2" && cp -r dist/. "$GITHUB_WORKSPACE/game/dist/v2/"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
